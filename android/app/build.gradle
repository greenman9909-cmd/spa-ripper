plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sparipper.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sparipper.mobile'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
