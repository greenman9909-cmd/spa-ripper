name: Python and Web CI

on:
  push:
    branches: [main]
    paths:
      - "spa_ripper/**"
      - "web/**"
      - "web_app.py"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/python-web-ci.yml"
  pull_request:
    paths:
      - "spa_ripper/**"
      - "web/**"
      - "web_app.py"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
